<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Mess Food Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Hostel Mess Food Prediction System</h1>
        <p>Food Consumption & Waste Management</p>
    </header>

    <!-- Main Container -->
    <main>

        <!-- Prediction Section -->
        <section class="prediction-section">

            <h2>Food Consumption Prediction</h2>

            <form id="predictionForm">

                <!-- Meal Type -->
                <div class="form-group">
                    <label for="mealType">Meal Type</label>

                    <select id="mealType" required>
                        <option value="">Select Meal Type</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>

                <!-- Menu -->
                <div class="form-group">
                    <label for="menu">Menu</label>

                    <select id="menu" required>
                        <option value="">Select Menu</option>
                        <option value="Rice">Rice</option>
                        <option value="Roti">Roti</option>
                        <option value="Dal">Dal</option>
                        <option value="Paneer">Paneer</option>
                        <option value="Vegetable">Vegetable</option>
                    </select>
                </div>

                <!-- Students -->
                <div class="form-group">
                    <label for="students">Total Students</label>

                    <input
                        type="number"
                        id="students"
                        placeholder="Enter total students"
                        min="1"
                        required
                    >
                </div>

                <!-- Attendance -->
                <div class="form-group">
                    <label for="attendance">Expected Attendance</label>

                    <input
                        type="number"
                        id="attendance"
                        placeholder="Enter expected attendance"
                        min="1"
                        required
                    >
                </div>

                <!-- Weather -->
                <div class="form-group">
                    <label for="weather">Weather</label>

                    <select id="weather" required>
                        <option value="">Select Weather</option>
                        <option value="Sunny">Sunny</option>
                        <option value="Cloudy">Cloudy</option>
                        <option value="Rainy">Rainy</option>
                    </select>
                </div>

                <!-- Special Event -->
                <div class="form-group">
                    <label for="specialEvent">Special Event</label>

                    <select id="specialEvent" required>
                        <option value="">Select</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Holiday -->
                <div class="form-group">
                    <label for="holiday">Holiday</label>

                    <select id="holiday" required>
                        <option value="">Select</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Previous Consumption -->
                <div class="form-group">
                    <label for="previousConsumption">
                        Previous Consumption (kg)
                    </label>

                    <input
                        type="number"
                        id="previousConsumption"
                        placeholder="Enter previous consumption"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <!-- Button -->
                <button type="submit">
                    Predict Food Requirement
                </button>

            </form>

        </section>

        <!-- Results Section -->
        <section class="results-section">

            <h2>Prediction Result</h2>

            <div class="result-card">

                <h3>Expected Food Consumption</h3>

                <p id="predictedConsumption">
                    -- kg
                </p>

            </div>

            <div class="result-card">

                <h3>Recommended Food Preparation</h3>

                <p id="recommendedQuantity">
                    -- kg
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
